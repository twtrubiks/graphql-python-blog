[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# coverage 改為需要時才加：pytest --cov=app --cov-report=html
# 設定（含 greenlet 與 80% 門檻）在 .coveragerc
addopts =
    -v
    --tb=short
# 單一測試超過 30 秒就判定失敗（pytest-timeout），例如等不到訂閱事件的 queue.get()，
# 讓 CI 失敗而不是整個卡住；目前最慢的測試約 4 秒
timeout = 30
